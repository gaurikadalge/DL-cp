[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-research-assistant"
version = "0.1.0"
description = "A grounded multimodal RAG research assistant for academic document ingestion, hybrid retrieval, and traceable citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicensed / Pending Team Agreement" }
authors = [
    { name = "Project Research Team" }
]
keywords = ["rag", "multimodal", "fastapi", "hybrid-search", "academic-assistant", "citations"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
rag = [
    "pymupdf>=1.23.0",
    "pytesseract>=0.3.10",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
]
frontend = [
    "streamlit>=1.32.0",
]
all = [
    "multimodal-rag-research-assistant[dev,rag,frontend]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ingestion*", "rag_engine*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "indexes",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (standard in FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
